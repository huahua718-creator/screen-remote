<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班務大屏傳屏助手</title>
  <!-- 如果有申請 Google AdSense，可在 <head> 引入 AdSense 腳本： -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.14) 0%, transparent 45%),
        linear-gradient(135deg, #f0f6ff 0%, #f8fafc 50%, #effaf5 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      padding: 32px 26px 26px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08), 0 2px 8px rgba(15, 23, 42, 0.04);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 122, 255, 0.1);
      color: #007aff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .role-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      margin: 12px 0;
      border-radius: 16px;
      text-decoration: none;
      text-align: left;
      color: white;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .role-btn:hover {
      transform: translateY(-2px);
    }

    .role-btn:active {
      transform: scale(0.985);
    }

    .btn-screen {
      background: linear-gradient(135deg, #007aff 0%, #2563eb 100%);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.28);
    }

    .btn-screen:hover {
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.36);
    }

    .btn-mobile {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 10px 22px rgba(22, 163, 74, 0.25);
    }

    .btn-mobile:hover {
      box-shadow: 0 14px 28px rgba(22, 163, 74, 0.34);
    }

    .role-icon {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .role-text {
      flex: 1;
    }

    .role-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .role-desc {
      font-size: 0.78rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .role-arrow {
      font-size: 1.1rem;
      opacity: 0.85;
    }

    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    .pill {
      font-size: 0.74rem;
      color: #475569;
      background: rgba(241, 245, 249, 0.9);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* 廣告容器樣式 */
    .ad-container { margin-top: 20px; width: 100%; max-width: 440px; text-align: center; }
    .custom-ad-banner { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 12px; border-radius: 12px; text-decoration: none; display: block; font-size: 0.85rem; font-weight: bold; }

    footer {
      margin-top: 22px;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
    }

    footer a {
      color: #64748b;
      text-decoration: none;
      border-bottom: 1px dashed #cbd5e1;
      transition: color 0.15s;
    }

    footer a:hover {
      color: #007aff;
      border-bottom-color: #007aff;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-badge">✨ 免裝 App・掃碼即投・P2P 直連</div>
    <h1>🖥️ 班務大屏傳屏助手</h1>
    <p class="subtitle">請選擇您當前要開啟的裝置角色，立即開始智慧課堂互動</p>

    <a href="screen.html" class="role-btn btn-screen">
      <div class="role-icon">📺</div>
      <div class="role-text">
        <div class="role-title">開啟【大屏接收端】</div>
        <div class="role-desc">適合教室電腦、觸控一體機與投影大屏</div>
      </div>
      <div class="role-arrow">➔</div>
    </a>

    <a href="mobile.html" class="role-btn btn-mobile">
      <div class="role-icon">📱</div>
      <div class="role-text">
        <div class="role-title">開啟【手機遙控器】</div>
        <div class="role-desc">推送網址、簡報照片、實物鏡頭與雙向傳檔</div>
      </div>
      <div class="role-arrow">➔</div>
    </a>

    <div class="feature-pills">
      <span class="pill">🌐 雙向網頁推送</span>
      <span class="pill">🖼️ PDF/照片標註</span>
      <span class="pill">🎥 實物投影</span>
      <span class="pill">📁 多檔快傳</span>
    </div>
  </div>
